<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Ketentuan & Garansi — VanzShop.com</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Syarat & ketentuan garansi produk digital di VanzShop.com. Baca aturan lengkap sebelum membeli.">
  <meta name="theme-color" content="#050509">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#050509;
      --surface:#0f0f17;
      --surface-2:#161622;
      --line:rgba(255,255,255,.07);
      --line-strong:rgba(255,255,255,.12);
      --text:#f5f5f5;
      --text-2:#b3b3c2;
      --text-3:#74748a;
      --gold:#f7d46a;
      --gold-2:#ffdf7a;
      --gold-deep:#d4a937;
      --gold-soft:rgba(247,212,106,.13);
      --gold-glow:rgba(247,212,106,.38);
      --radius:16px;
      --ease:cubic-bezier(.2,.7,.2,1);
    }

    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    body{
      min-height:100vh;min-height:100dvh;
      font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
      background:var(--bg);color:var(--text);
      display:flex;flex-direction:column;
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
    }
    ::selection{background:var(--gold-glow);color:#fff}

    /* =====================================================
       SPACE BACKGROUND — gold glow + planet + orbs + stars
       ===================================================== */
    .space{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .space-grad{
      position:absolute;inset:0;
      background:
        radial-gradient(circle at 15% 0%, rgba(40,40,90,.85), transparent 60%),
        radial-gradient(circle at 50% 120%, rgba(8,8,18,.9), #050509 70%);
    }
    .sun-glow{
      position:absolute;right:-160px;top:-60px;
      width:520px;height:520px;border-radius:50%;
      background:radial-gradient(circle, rgba(247,212,106,.42) 0%, rgba(247,212,106,.12) 35%, transparent 62%);
      filter:blur(6px);mix-blend-mode:screen;
      animation:pulse 9s ease-in-out infinite;
    }
    @keyframes pulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}

    #stars{position:absolute;inset:0;width:100%;height:100%}

    /* Planet utama (kanan atas) */
    .planet{
      position:absolute;right:6%;top:90px;
      width:150px;height:150px;
      animation:drift 26s ease-in-out infinite alternate;
    }
    .planet .body{
      position:absolute;inset:0;border-radius:50%;
      background:
        radial-gradient(circle at 32% 28%, #fff7c8 0%, #ffe083 22%, #d4a937 55%, #7f6518 82%, #3a2d08 100%);
      box-shadow:
        0 0 60px rgba(247,212,106,.35),
        0 0 140px rgba(247,212,106,.15),
        inset -18px -22px 40px rgba(0,0,0,.55),
        inset 8px 10px 20px rgba(255,255,255,.18);
      overflow:hidden;
    }
    /* garis-garis atmosfer planet */
    .planet .body::before{
      content:"";position:absolute;inset:-10%;
      background:repeating-linear-gradient(-18deg,
        transparent 0 14px, rgba(127,101,24,.28) 14px 20px, transparent 20px 34px, rgba(255,240,190,.12) 34px 38px);
      animation:spin 40s linear infinite;
      mix-blend-mode:multiply;
    }
    /* cincin planet */
    .planet .ring{
      position:absolute;left:50%;top:50%;
      width:250px;height:250px;
      transform:translate(-50%,-50%) rotateX(74deg) rotateZ(-16deg);
      border-radius:50%;
      border:10px solid rgba(247,212,106,.45);
      box-shadow:0 0 0 3px rgba(255,223,122,.18), 0 0 0 16px rgba(247,212,106,.08), 0 0 30px rgba(247,212,106,.25);
    }
    .planet .ring.back{z-index:0}
    .planet .body{z-index:1}
    /* bagian depan cincin (nutupin planet bawah) */
    .planet .ring.front{
      z-index:2;
      clip-path:inset(50% 0 0 0);
    }
    .planet .ring.back{clip-path:inset(0 0 50% 0)}

    /* Planet kecil (kiri bawah) */
    .moon{
      position:absolute;left:4%;bottom:12%;
      width:64px;height:64px;border-radius:50%;
      background:radial-gradient(circle at 30% 25%, #e8e6ff 0%, #8a86c9 40%, #37335f 80%, #16142a 100%);
      box-shadow:0 0 40px rgba(138,134,201,.25), inset -10px -12px 20px rgba(0,0,0,.6);
      animation:drift 30s ease-in-out infinite alternate-reverse;
      opacity:.85;
    }
    .moon::after{
      content:"";position:absolute;left:22%;top:48%;width:12px;height:12px;border-radius:50%;
      background:rgba(0,0,0,.18);box-shadow:18px -14px 0 -3px rgba(0,0,0,.15), 10px 10px 0 -4px rgba(0,0,0,.14);
    }

    .orb{
      position:absolute;border-radius:50%;
      background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.07), transparent 65%);
      animation:floatOrb 36s ease-in-out infinite alternate;
    }
    .orb-1{width:160px;height:160px;left:8%;top:38%;animation-delay:-6s}
    .orb-2{width:260px;height:260px;right:10%;bottom:-60px;animation-delay:-14s}
    .orb-3{width:120px;height:120px;left:42%;top:12%;animation-delay:-22s}

    .shooting{
      position:absolute;top:18%;left:-10%;
      width:140px;height:2px;border-radius:2px;
      background:linear-gradient(90deg,transparent,rgba(255,223,122,.9));
      transform:rotate(18deg);
      opacity:0;
      animation:shoot 11s ease-in 3s infinite;
    }
    @keyframes shoot{
      0%{opacity:0;transform:translate(0,0) rotate(18deg)}
      2%{opacity:1}
      9%{opacity:0;transform:translate(70vw,23vw) rotate(18deg)}
      100%{opacity:0;transform:translate(70vw,23vw) rotate(18deg)}
    }
    @keyframes drift{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(-18px,22px,0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes floatOrb{
      0%{transform:translate3d(0,0,0);opacity:.45}
      50%{transform:translate3d(18px,-24px,0);opacity:.8}
      100%{transform:translate3d(-12px,-6px,0);opacity:.5}
    }

    /* =====================================================
       LAYOUT
       ===================================================== */
    .shell{
      position:relative;z-index:1;
      width:100%;max-width:1320px;margin:0 auto;
      padding:14px 24px 40px;flex:1;
    }

    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .back-link{
      display:inline-flex;align-items:center;gap:8px;
      color:var(--text-2);text-decoration:none;
      font-size:.84rem;font-weight:500;
      padding:7px 14px;border-radius:999px;
      background:rgba(255,255,255,.03);border:1px solid var(--line);
      transition:color .15s,border-color .15s,background .15s;
    }
    .back-link svg{transition:transform .2s var(--ease)}
    .back-link:hover{color:var(--text);border-color:rgba(247,212,106,.5);background:var(--gold-soft)}
    .back-link:hover svg{transform:translateX(-3px)}

    /* ===== Hero + logo ===== */
    .hero{text-align:center;padding:40px 0 44px}
    .logo-circle{
      width:96px;height:96px;margin:0 auto 14px;border-radius:50%;overflow:hidden;
      background:radial-gradient(circle at 30% 20%, #fff7c8 0%, #ffe083 35%, #d4a937 70%, #7f6518 100%);
      border:2px solid rgba(255,220,140,.65);
      box-shadow:0 14px 36px rgba(0,0,0,.9), 0 0 40px rgba(247,212,106,.2),
        inset 0 7px 12px rgba(255,255,255,.23), inset 0 -7px 12px rgba(0,0,0,.45);
      display:flex;align-items:center;justify-content:center;
    }
    .logo-circle img{width:94%;height:94%;object-fit:contain;border-radius:50%}
    .brand{margin:0 0 26px;font-size:1.1rem;font-weight:700;color:var(--gold-2)}
    .eyebrow{
      margin:0 0 14px;
      font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
      color:var(--gold);opacity:.8;
    }
    .hero h1{
      margin:0 0 16px;
      font-size:clamp(2rem,4.2vw,3rem);
      font-weight:800;letter-spacing:-.025em;line-height:1.1;
      background:linear-gradient(180deg,#fff 25%,#ffe9a8 70%,#d4a937);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .hero p{margin:0 auto;max-width:420px;font-size:.95rem;line-height:1.6;color:var(--text-2)}

    /* ===== Card wrap ===== */
    .card{
      background:radial-gradient(circle at top, rgba(255,255,255,.03), transparent 55%), rgba(17,17,24,.78);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:0 28px 80px rgba(0,0,0,.85);
      padding:26px;
    }

    .grid{
      display:grid;
      grid-template-columns:minmax(240px,340px) 1fr;
      gap:34px;align-items:start;
    }

    /* ===== Sidebar ===== */
    .sidebar{position:sticky;top:20px}
    .search{
      position:relative;display:flex;align-items:center;
      background:linear-gradient(135deg,#161624,#101018);
      border:1px solid var(--line-strong);border-radius:12px;
      transition:border-color .15s, box-shadow .15s;
    }
    .search:focus-within{border-color:rgba(247,212,106,.75);box-shadow:0 0 0 4px rgba(247,212,106,.12)}
    .search svg{position:absolute;left:14px;color:var(--text-3);pointer-events:none}
    .search input{
      width:100%;padding:13px 60px 13px 38px;
      background:transparent;border:0;outline:0;
      color:var(--text);font:inherit;font-size:.9rem;
    }
    .search input::placeholder{color:var(--text-3)}
    .search input::-webkit-search-cancel-button{display:none}
    .kbd{
      position:absolute;right:10px;
      font-size:.7rem;font-weight:600;color:var(--text-3);
      border:1px solid var(--line-strong);border-radius:6px;padding:2px 7px;
      background:var(--surface-2);pointer-events:none;transition:opacity .15s;
    }
    .clear-btn{
      position:absolute;right:8px;display:none;align-items:center;justify-content:center;
      width:26px;height:26px;border-radius:7px;border:0;background:transparent;color:var(--text-3);cursor:pointer;
    }
    .clear-btn:hover{background:var(--surface-2);color:var(--text)}
    .search.has-value .clear-btn{display:flex}
    .search.has-value .kbd{opacity:0}

    .list-head{
      display:flex;justify-content:space-between;align-items:center;
      margin:22px 4px 8px;
      font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);
    }
    .list-head .count{letter-spacing:0;text-transform:none;font-weight:500}

    .list-wrap{position:relative}
    .list-wrap::after{
      content:"";position:absolute;left:0;right:10px;bottom:0;height:28px;
      background:linear-gradient(transparent,rgba(17,17,24,.95));
      pointer-events:none;transition:opacity .2s;
    }
    .list-wrap.at-end::after{opacity:0}

    .product-list{
      list-style:none;margin:0;padding:0 6px 0 0;
      max-height:min(440px,54vh);overflow-y:auto;
      scrollbar-width:thin;scrollbar-color:var(--gold-deep) transparent;
    }
    .product-list::-webkit-scrollbar{width:5px}
    .product-list::-webkit-scrollbar-thumb{background:linear-gradient(var(--gold),var(--gold-deep));border-radius:9px}

    .product-item{
      position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;
      width:100%;padding:7px 14px;margin-bottom:2px;
      border-radius:10px;border:0;background:transparent;
      color:var(--text-2);font:inherit;font-size:.88rem;font-weight:500;text-align:left;
      cursor:pointer;transition:color .12s, background .12s;
    }
    .product-item:hover{color:var(--text);background:rgba(255,255,255,.04)}
    .product-item.kb-focus{background:rgba(255,255,255,.06);color:var(--text)}
    .product-item[aria-selected="true"]{
      color:var(--gold-2);font-weight:700;
      background:linear-gradient(90deg,rgba(247,212,106,.2),rgba(247,212,106,.04));
      box-shadow:inset 0 0 0 1px rgba(247,212,106,.25);
    }
    .product-item[aria-selected="true"]::before{
      content:"";position:absolute;left:0;top:50%;width:3px;height:60%;
      transform:translateY(-50%);border-radius:3px;
      background:var(--gold);box-shadow:0 0 10px var(--gold);
    }
    .product-item .tag{
      font-size:.6rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
      padding:2px 7px;border-radius:999px;
      color:#1a1405;background:linear-gradient(135deg,var(--gold-2),var(--gold-deep));
    }
    .product-item mark{background:transparent;color:var(--gold);font-weight:700;text-decoration:underline;text-underline-offset:3px}

    .empty{padding:28px 12px;text-align:center;font-size:.85rem;color:var(--text-3)}
    .empty b{color:var(--text-2)}

    /* ===== Detail ===== */
    .detail{min-height:400px}
    .detail-title{
      display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      margin:4px 0 0;padding-bottom:16px;border-bottom:1px solid var(--line);
      font-size:1.35rem;font-weight:800;letter-spacing:-.01em;
    }
    .pill{
      font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:999px;
      background:var(--gold-soft);color:var(--gold-2);border:1px solid rgba(247,212,106,.3);
    }
    .blocks{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
    .block{
      background:linear-gradient(145deg,var(--surface-2),#10101a);
      border:1px solid var(--line);border-radius:var(--radius);
      padding:18px 18px 8px;
      box-shadow:0 16px 30px rgba(0,0,0,.55);
    }
    .block-title{
      display:flex;align-items:center;gap:10px;margin:0 0 12px;
      font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-2);
    }
    .block-title .ic{
      width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
      background:rgba(0,0,0,.55);border:1px solid rgba(247,212,106,.25);color:var(--gold);
    }
    .divider{height:1px;margin-bottom:14px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent)}

    .rules{list-style:none;margin:0;padding:0}
    .rules li{
      position:relative;padding-left:20px;margin-bottom:12px;
      font-size:.92rem;line-height:1.55;color:var(--text);
    }
    .rules li::before{
      content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;
      background:var(--gold);box-shadow:0 0 8px var(--gold-glow);
    }

    .actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:28px}
    .btn{
      display:inline-flex;align-items:center;gap:8px;
      padding:13px 24px;border-radius:999px;
      font:inherit;font-size:.9rem;font-weight:700;text-decoration:none;cursor:pointer;border:0;
      transition:transform .15s var(--ease), box-shadow .2s, filter .2s, background .15s, border-color .15s;
    }
    .btn-primary{
      color:#1a1405;
      background:linear-gradient(180deg,#ffe58f,#e6b93f);
      box-shadow:0 1px 0 rgba(255,255,255,.45) inset, 0 10px 28px -8px var(--gold-glow);
    }
    .btn-primary:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 1px 0 rgba(255,255,255,.45) inset, 0 16px 34px -8px var(--gold-glow)}
    .btn-primary:active{transform:translateY(0)}
    .btn-ghost{color:var(--text-2);background:rgba(255,255,255,.03);border:1px solid var(--line-strong)}
    .btn-ghost:hover{color:var(--text);border-color:rgba(247,212,106,.5)}

    .placeholder-state{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;gap:14px;min-height:380px;padding:30px;
      border:1px dashed rgba(247,212,106,.2);border-radius:var(--radius);
      color:var(--text-3);font-size:.9rem;
    }
    .placeholder-state .ic{
      width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
      background:var(--gold-soft);color:var(--gold);box-shadow:0 0 30px rgba(247,212,106,.15);
    }
    .error-box{
      padding:18px;border-radius:12px;font-size:.88rem;line-height:1.6;
      background:rgba(255,90,90,.08);border:1px solid rgba(255,90,90,.3);color:#ffc2c2;
    }
    .error-box code{background:rgba(0,0,0,.35);padding:1px 6px;border-radius:5px}

    .fade-in{animation:fadeIn .35s var(--ease) both}
    .fade-in .rules li{animation:fadeUp .4s var(--ease) both}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

    .toast{
      position:fixed;left:50%;bottom:24px;z-index:10;transform:translate(-50%,20px);opacity:0;
      padding:10px 18px;border-radius:999px;
      background:var(--surface-2);border:1px solid rgba(247,212,106,.35);
      font-size:.84rem;color:var(--gold-2);
      box-shadow:0 12px 30px rgba(0,0,0,.6);
      transition:opacity .2s, transform .25s var(--ease);pointer-events:none;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    footer{position:relative;z-index:1;text-align:center;padding:22px 16px 26px;font-size:.82rem;color:var(--text-3)}
    footer .heart{color:var(--gold);display:inline-block;animation:beat 1.6s ease-in-out infinite}
    footer b{color:var(--gold-2);font-weight:600}
    @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}}

    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

    /* ===== Responsive ===== */
    @media (max-width:1000px){
      .blocks{grid-template-columns:1fr}
    }
    @media (max-width:860px){
      .shell{padding:12px 16px 32px}
      .hero{padding:26px 0 28px}
      .logo-circle{width:80px;height:80px}
      .card{padding:18px 16px;border-radius:22px}
      .grid{grid-template-columns:1fr;gap:24px}
      .sidebar{position:static}
      .product-list{max-height:260px}
      .kbd{display:none}
      .detail{min-height:0}
      .placeholder-state{min-height:200px}
      .planet{right:-40px;top:60px;transform:scale(.6)}
      .planet{animation:none}
      .moon{width:44px;height:44px}
    }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none!important;transition:none!important}
    }
  </style>
</head>
<body>
  <!-- ===== BACKGROUND ===== -->
  <div class="space" aria-hidden="true">
    <div class="space-grad"></div>
    <canvas id="stars"></canvas>
    <div class="sun-glow"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="planet">
      <div class="ring back"></div>
      <div class="body"></div>
      <div class="ring front"></div>
    </div>
    <div class="moon"></div>
    <div class="shooting"></div>
  </div>

  <main class="shell">
    <div class="topbar">
      <a href="https://vanzshop.com" class="back-link" id="homeLink">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Kembali ke Home
      </a>
    </div>

    <header class="hero">
      <div class="logo-circle"><img src="logo.png" alt="Logo VanzShop.com" onerror="this.remove()"></div>
      <div class="brand" id="brandName">VanzShop.com</div>
      <p class="eyebrow">Ketentuan Produk</p>
      <h1>Ketentuan &amp; Garansi</h1>
      <p>Pilih produk untuk melihat detail ketentuan layanan dan garansinya.</p>
    </header>

    <div class="card">
      <div class="grid">
        <aside class="sidebar">
          <label class="search" id="searchBox">
            <span class="sr-only">Cari produk</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="searchInput" type="search" placeholder="Cari produk" autocomplete="off" spellcheck="false"
                   role="combobox" aria-controls="productList" aria-expanded="true" aria-autocomplete="list">
            <span class="kbd" aria-hidden="true">/</span>
            <button type="button" class="clear-btn" id="clearBtn" aria-label="Hapus pencarian">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </label>

          <div class="list-head"><span>Produk</span><span class="count" id="countLabel"></span></div>

          <div class="list-wrap" id="listWrap">
            <ul class="product-list" id="productList" role="listbox" aria-label="Daftar produk"></ul>
          </div>
        </aside>

        <section class="detail" id="detail" aria-live="polite"></section>
      </div>
    </div>
  </main>

  <footer>Made With <span class="heart">♥</span> <b id="footerName">VanzShop.com</b></footer>
  <div class="toast" id="toast" role="status"></div>

  <!-- DATA PRODUK: edit di file produk.js -->
  <script src="produk.js"></script>

  <script>
  (() => {
    "use strict";
    const $ = s => document.querySelector(s);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    /* ================= CONFIG ================= */
    const CFG = Object.assign({
      whatsapp: "",
      namaToko: "VanzShop.com",
      linkHome: "https://vanzshop.com",
      pesanKlaim: "Halo admin, saya mau klaim garansi.\n\nProduk: {produk}"
    }, window.VANZ_CONFIG || {});

    $("#homeLink").href = CFG.linkHome;
    $("#brandName").textContent = CFG.namaToko;
    $("#footerName").textContent = CFG.namaToko;

    /* ================= PARSER produk.js =================
       Ubah teks format [Nama] / ketentuan: / garansi: jadi data */
    const slug = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                       .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

    function parseProduk(raw) {
      const out = [], warn = [];
      let cur = null, section = null;
      raw.split(/\r?\n/).forEach((line, n) => {
        const t = line.trim();
        if (!t || t.startsWith("#")) return;

        const head = t.match(/^\[(.+)\]$/);
        if (head) {
          cur = { name: head[1].trim(), key: slug(head[1]), badge: "", tag: "", ketentuan: [], garansi: [] };
          out.push(cur); section = null; return;
        }
        if (!cur) { warn.push(`Baris ${n + 1} di luar produk: "${t}"`); return; }

        const kv = t.match(/^(badge|tag|ketentuan|syarat|garansi)\s*:\s*(.*)$/i);
        if (kv) {
          const k = kv[1].toLowerCase();
          if (k === "badge" || k === "tag") { cur[k] = kv[2].trim(); section = null; }
          else { section = k === "syarat" ? "ketentuan" : k; if (kv[2].trim()) cur[section].push(kv[2].trim()); }
          return;
        }
        const item = t.match(/^[-•*]\s*(.+)$/);
        if (item && section) { cur[section].push(item[1].trim()); return; }
        if (section && cur[section].length) { cur[section][cur[section].length - 1] += " " + t; return; }
        warn.push(`Baris ${n + 1} gak kebaca: "${t}"`);
      });

      // key duplikat → kasih nomor
      const seen = {};
      out.forEach(p => { if (seen[p.key]) p.key += "-" + (++seen[p.key]); else seen[p.key] = 1; });
      if (warn.length) console.warn("[produk.js]\n" + warn.join("\n"));
      return out;
    }

    const PRODUCTS = typeof window.VANZ_PRODUK === "string" ? parseProduk(window.VANZ_PRODUK) : [];

    /* ================= ENGINE ================= */
    const listEl = $("#productList"), listWrap = $("#listWrap"), detailEl = $("#detail");
    const inputEl = $("#searchInput"), boxEl = $("#searchBox"), clearBtn = $("#clearBtn");
    const countEl = $("#countLabel"), toastEl = $("#toast");

    const sorted = [...PRODUCTS].sort((a, b) => a.name.localeCompare(b.name, "id"));
    const byKey = Object.fromEntries(sorted.map(p => [p.key, p]));
    const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

    let filtered = sorted, activeKey = null, kbIndex = -1;

    if (!sorted.length) {
      detailEl.innerHTML = `<div class="error-box">Data produk gak ketemu. Pastikan file <code>produk.js</code> ada di folder yang sama dengan halaman ini dan formatnya benar.</div>`;
      countEl.textContent = "0 item";
      return;
    }

    function highlight(name, q) {
      if (!q) return esc(name);
      const i = norm(name).indexOf(q);
      if (i < 0) return esc(name);
      return esc(name.slice(0, i)) + "<mark>" + esc(name.slice(i, i + q.length)) + "</mark>" + esc(name.slice(i + q.length));
    }

    function renderList() {
      const q = norm(inputEl.value);
      boxEl.classList.toggle("has-value", inputEl.value.length > 0);
      filtered = !q ? sorted : sorted.filter(p => norm(p.name).includes(q) || norm(p.badge).includes(q));
      countEl.textContent = q ? `${filtered.length} / ${sorted.length}` : `${sorted.length} item`;

      if (!filtered.length) {
        listEl.innerHTML = `<li class="empty">Produk <b>"${esc(inputEl.value)}"</b> gak ketemu.</li>`;
        kbIndex = -1; updateFade(); return;
      }
      listEl.innerHTML = filtered.map((p, i) => `
        <li role="none">
          <button type="button" class="product-item" role="option" id="opt-${p.key}"
                  data-key="${p.key}" data-i="${i}" aria-selected="${p.key === activeKey}" tabindex="-1">
            <span>${highlight(p.name, q)}</span>
            ${p.tag ? `<span class="tag">${esc(p.tag)}</span>` : ""}
          </button>
        </li>`).join("");
      kbIndex = q ? 0 : filtered.findIndex(p => p.key === activeKey);
      paintKb(); updateFade();
    }

    function paintKb() {
      listEl.querySelectorAll(".product-item").forEach((el, i) =>
        el.classList.toggle("kb-focus", i === kbIndex && !!inputEl.value));
      const cur = listEl.querySelector(`[data-i="${kbIndex}"]`);
      if (cur) { inputEl.setAttribute("aria-activedescendant", cur.id); cur.scrollIntoView({ block: "nearest" }); }
      else inputEl.removeAttribute("aria-activedescendant");
    }

    const ICON_DOC = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>`;
    const ICON_SHIELD = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>`;

    function renderDetail() {
      const p = byKey[activeKey];
      if (!p) {
        detailEl.innerHTML = `
          <div class="placeholder-state fade-in">
            <div class="ic">${ICON_SHIELD.replace(/14/g, "24")}</div>
            Pilih produk di sebelah kiri untuk melihat ketentuan &amp; garansinya.
          </div>`;
        return;
      }
      const li = arr => arr.length
        ? arr.map((t, i) => `<li style="animation-delay:${60 + i * 45}ms">${esc(t)}</li>`).join("")
        : `<li style="color:var(--text-3)">Belum ada data.</li>`;

      detailEl.innerHTML = `
        <div class="fade-in">
          <h2 class="detail-title">${esc(p.name)} ${p.badge ? `<span class="pill">${esc(p.badge)}</span>` : ""}</h2>
          <div class="blocks">
            <div class="block">
              <p class="block-title"><span class="ic">${ICON_DOC}</span>Ketentuan</p>
              <div class="divider"></div>
              <ul class="rules">${li(p.ketentuan)}</ul>
            </div>
            <div class="block">
              <p class="block-title"><span class="ic">${ICON_SHIELD}</span>Garansi</p>
              <div class="divider"></div>
              <ul class="rules">${li(p.garansi)}</ul>
            </div>
          </div>
          <div class="actions">
            ${CFG.whatsapp ? `<a class="btn btn-primary" target="_blank" rel="noopener" href="${claimUrl(p)}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11.8 11.8 0 0 0 1.9 17.6L.5 23.5l6-1.6A11.8 11.8 0 0 0 20.5 3.5zM12 21.4c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.6.9 1-3.5-.2-.4A9.4 9.4 0 1 1 12 21.4zm5.2-7c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1l-.9 1.2c-.2.2-.3.2-.6.1a7.7 7.7 0 0 1-3.8-3.3c-.3-.5.3-.5.8-1.6.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5 1.9.8 2.6.9 3.6.7.6-.1 1.7-.7 2-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3z"/></svg>
              Klaim Garansi Sekarang</a>` : ""}
            <button type="button" class="btn btn-ghost" id="shareBtn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
              Salin Link
            </button>
          </div>
        </div>`;
      $("#shareBtn").addEventListener("click", () => copyLink(p));
    }

    const claimUrl = p => `https://wa.me/${CFG.whatsapp}?text=${encodeURIComponent(CFG.pesanKlaim.replace(/\{produk\}/g, p.name))}`;

    async function copyLink(p) {
      const url = location.href.split("#")[0] + "#" + p.key;
      try { await navigator.clipboard.writeText(url); toast("Link disalin ✓"); }
      catch {
        const t = document.createElement("textarea"); t.value = url; document.body.appendChild(t); t.select();
        try { document.execCommand("copy"); toast("Link disalin ✓"); } catch { toast("Gagal menyalin link"); }
        t.remove();
      }
    }

    let toastTimer;
    function toast(msg) {
      toastEl.textContent = msg; toastEl.classList.add("show");
      clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    function select(key, { updateHash = true, scroll = false } = {}) {
      if (!byKey[key] || key === activeKey) return;
      activeKey = key;
      listEl.querySelectorAll(".product-item").forEach(el => el.setAttribute("aria-selected", el.dataset.key === key));
      renderDetail();
      if (updateHash && location.hash.slice(1) !== key) history.replaceState(null, "", "#" + key);
      document.title = `${byKey[key].name} — Ketentuan & Garansi | ${CFG.namaToko}`;
      if (scroll && matchMedia("(max-width:860px)").matches) detailEl.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function updateFade() {
      listWrap.classList.toggle("at-end", listEl.scrollHeight - listEl.scrollTop - listEl.clientHeight < 4);
    }

    listEl.addEventListener("click", e => { const b = e.target.closest(".product-item"); if (b) select(b.dataset.key, { scroll: true }); });
    listEl.addEventListener("scroll", updateFade, { passive: true });
    inputEl.addEventListener("input", renderList);
    inputEl.addEventListener("keydown", e => {
      if (!filtered.length) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        kbIndex = e.key === "ArrowDown" ? Math.min(filtered.length - 1, kbIndex + 1) : Math.max(0, kbIndex - 1);
        if (!inputEl.value) select(filtered[kbIndex].key);
        paintKb();
      } else if (e.key === "Enter") {
        e.preventDefault(); const p = filtered[Math.max(0, kbIndex)]; if (p) select(p.key, { scroll: true });
      } else if (e.key === "Escape") { inputEl.value = ""; renderList(); }
    });
    clearBtn.addEventListener("click", e => { e.preventDefault(); inputEl.value = ""; renderList(); inputEl.focus(); });
    document.addEventListener("keydown", e => {
      if (e.key === "/" && document.activeElement !== inputEl && !e.ctrlKey && !e.metaKey) { e.preventDefault(); inputEl.focus(); inputEl.select(); }
    });
    addEventListener("hashchange", () => select(location.hash.slice(1), { updateHash: false }));

    const initial = location.hash.slice(1);
    activeKey = byKey[initial] ? initial : null;
    renderList(); renderDetail();
    if (activeKey) document.title = `${byKey[activeKey].name} — Ketentuan & Garansi | ${CFG.namaToko}`;
  })();

  /* ================= STARFIELD (bintang putih + gold) ================= */
  (() => {
    const cv = document.getElementById("stars"), ctx = cv.getContext("2d");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let stars = [], W = 0, H = 0, raf = 0;

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      stars = Array.from({ length: Math.round(W * H / 8500) }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.1 + .25, a: Math.random() * .6 + .2,
        tw: Math.random() * .02 + .004, ph: Math.random() * 6.28,
        vy: Math.random() * .05 + .01,
        c: Math.random() < .22 ? "255,223,122" : "255,255,255"
      }));
      if (reduce) draw(0);
    }
    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      for (const s of stars) {
        const a = reduce ? s.a : s.a * (.55 + .45 * Math.sin(s.ph + t * s.tw * .06));
        ctx.fillStyle = `rgba(${s.c},${a})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
        if (!reduce) { s.y -= s.vy; if (s.y < -2) { s.y = H + 2; s.x = Math.random() * W; } }
      }
    }
    const loop = t => { draw(t); raf = requestAnimationFrame(loop); };
    let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(resize, 120); });
    document.addEventListener("visibilitychange", () => {
      if (reduce) return;
      document.hidden ? cancelAnimationFrame(raf) : (raf = requestAnimationFrame(loop));
    });
    resize(); if (!reduce) raf = requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
